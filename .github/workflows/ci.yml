name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build and test (macOS)
        run: swift test
      - name: Build (iOS Simulator)
        run: xcodebuild build -scheme Composition -destination 'generic/platform=iOS Simulator' -quiet
